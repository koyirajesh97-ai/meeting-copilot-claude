name: Release
# Push a tag like v0.1.0 to build installers and publish them as a GitHub Release (the packaged
# app's auto-update reads from there). Windows builds are unsigned until CSC_LINK /
# CSC_KEY_PASSWORD secrets exist; macOS builds are signed and notarized when the Apple secrets exist.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            dist: dist:win
            exe: release/win-unpacked/meeting-copilot.exe
          - os: macos-latest
            dist: dist:mac
            exe: ""
          - os: ubuntu-latest
            dist: dist:linux
            exe: release/linux-unpacked/meeting-copilot
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build the installer
        shell: bash
        run: |
          # Unset secrets that aren't configured: an empty CSC_LINK is read as a (missing) file.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID MAIN_VITE_SENTRY_DSN MAIN_VITE_OTEL_ENDPOINT; do
            [ -n "${!v}" ] || unset "$v"
          done
          pnpm -C apps/desktop ${{ matrix.dist }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MAIN_VITE_SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          MAIN_VITE_OTEL_ENDPOINT: ${{ vars.OTEL_ENDPOINT }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Without a certificate, build unsigned instead of searching the keychain.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
      - name: Smoke-test the packaged app
        if: matrix.exe != ''
        shell: bash
        run: |
          cd apps/desktop
          npx playwright install-deps chromium >/dev/null 2>&1 || true
          if [ "$RUNNER_OS" = "Linux" ]; then sudo apt-get install -y xvfb >/dev/null; RUN="xvfb-run -a"; fi
          COPILOT_PACKAGED_APP="${{ matrix.exe }}" $RUN npx playwright test e2e/packaged.spec.ts
      - name: Publish to the GitHub Release
        # Installers plus latest*.yml and .blockmap files, which auto-update reads.
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="${GITHUB_REF_NAME}"
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Meeting Copilot $tag" || true
          shopt -s nullglob
          files=(apps/desktop/release/*.exe apps/desktop/release/*.dmg apps/desktop/release/*.zip apps/desktop/release/*.AppImage apps/desktop/release/*.blockmap apps/desktop/release/latest*.yml)
          gh release upload "$tag" "${files[@]}" --clobber
