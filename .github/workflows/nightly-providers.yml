name: Nightly provider check
on:
  schedule:
    - cron: "17 9 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check-providers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: cd services/backend && uv sync --locked
      - name: Ping every free provider
        id: check
        continue-on-error: true
        run: scripts/check-providers --json > "$RUNNER_TEMP/results.json"
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          MISTRAL_API_KEY: ${{ secrets.MISTRAL_API_KEY }}
          DEEPGRAM_API_KEY: ${{ secrets.DEEPGRAM_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GLADIA_API_KEY: ${{ secrets.GLADIA_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - name: Open or update the provider-check issue
        if: steps.check.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd services/backend
          uv run python -m app.router.report "$RUNNER_TEMP/results.json" > "$RUNNER_TEMP/issue.md"
          [ -s "$RUNNER_TEMP/issue.md" ] || exit 0
          title=$(head -n1 "$RUNNER_TEMP/issue.md")
          tail -n +2 "$RUNNER_TEMP/issue.md" > "$RUNNER_TEMP/body.md"
          gh label create provider-check --color B60205 --description "Nightly provider check" 2>/dev/null || true
          existing=$(gh issue list --label provider-check --state open --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file "$RUNNER_TEMP/body.md"
          else
            gh issue create --title "$title" --label provider-check --body-file "$RUNNER_TEMP/body.md"
          fi
      - name: Fail the run when a provider has a problem
        if: steps.check.outcome == 'failure'
        run: exit 1
