name: Web app (GitHub Pages)
# Builds apps/web and publishes it to GitHub Pages when run (Actions → Run workflow). Without the
# BACKEND_URL repository variable the site is the demo (sample meetings, nothing recorded).
# Optional repository variables: BACKEND_URL, SUPABASE_URL, SUPABASE_ANON_KEY (public anon key).
on:
  # Manual: enable Pages first (Settings → Pages → Source: GitHub Actions), then run it.
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build
        env:
          WEB_BASE: /${{ github.event.repository.name }}/
          VITE_BACKEND_URL: ${{ vars.BACKEND_URL }}
          VITE_SUPABASE_URL: ${{ vars.SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          pnpm --filter @meeting-copilot/web build
          find apps/web/dist -name '*.map' -delete
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
