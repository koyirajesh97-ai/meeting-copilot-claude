[project]
name = "meeting-copilot-backend"
version = "0.0.0"
description = "Meeting Copilot backend: REST, WebSocket, provider router"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi[standard]>=0.115",
    "httpx>=0.27",
    "litellm>=1.60",
    "psycopg[binary,pool]>=3.2",
    "pydantic>=2.9",
    "pyjwt[crypto]>=2.9",
    "pyyaml>=6.0",
    "websockets>=14",
]

[project.optional-dependencies]
# Local-only mode and last-resort fallback: transcription on this machine.
local = ["faster-whisper>=1.1"]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "pytest-asyncio>=0.24",
]

[tool.fastapi]
entrypoint = "app.main:app"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
# `ruff format` owns line length; long strings and SQL are left as written.
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
