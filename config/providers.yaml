# Free providers, limits, fallback order and data policy.
# Providers marked `local: true` run on this machine; Local-only meetings use nothing else.
# Verify current limits in each provider's console; they change often.
tasks:                     # tried in order; next one on 429, timeout or bad JSON
  detect:  [groq/llama-3.1-8b-instant, groq/openai/gpt-oss-20b, ollama/llama3.2:3b]
  card:    [groq/openai/gpt-oss-20b, groq/openai/gpt-oss-120b, mistral/mistral-small-latest, ollama/llama3.2:3b]
  catchup: [groq/openai/gpt-oss-20b, mistral/mistral-small-latest, ollama/llama3.2:3b]
  clarify: [groq/openai/gpt-oss-20b, mistral/mistral-small-latest, ollama/llama3.2:3b]
  standup: [groq/openai/gpt-oss-120b, mistral/mistral-small-latest, ollama/llama3.2:3b]
  summary: [mistral/mistral-small-latest, groq/openai/gpt-oss-120b, gemini/gemini-flash, ollama/llama3.2:3b]
  ask:     [mistral/mistral-small-latest, groq/openai/gpt-oss-120b, ollama/llama3.2:3b]
  stt_live: [deepgram/nova-3, gladia/live, groq/whisper-large-v3, local/faster-whisper]
  # 384-dimension embeddings for search; every model in this list must produce 384 dims.
  embed:   [local/bge-small-en-v1.5, cloudflare/bge-small-en-v1.5]
  # Voice embeddings for recognizing enrolled speakers; runs on this machine only.
  speaker_id: [local/pyannote-wespeaker]
speaker_id:
  threshold: 0.75        # cosine similarity needed to name an enrolled speaker
  min_audio_s: 6         # audio collected per speaker before the first match attempt
  max_audio_s: 20        # give up (leave "Speaker N") after this much unmatched audio
live_help:
  card_min_confidence: 0.5   # below this, show "No grounded answer" with I'll follow up
  recent_minutes: 5          # transcript window given to cards
  context_chunks: 3          # project excerpts given to cards
  topic_cooldown_s: 60       # at most one topic card per minute
timeouts_s: {detect: 1.0, card: 1.5, catchup: 4, clarify: 3, standup: 8, summary: 60, ask: 15}
providers:
  groq:
    signup_url: https://console.groq.com/keys
    base_url: https://api.groq.com/openai/v1
    key_env: GROQ_API_KEY
    trains_on_data: false
    models:
      llama-3.1-8b-instant: {rpm: 30, rpd: 14400, tpd: 500000}
      openai/gpt-oss-20b:   {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
      openai/gpt-oss-120b:  {rpm: 30, rpd: 1000, tpm: 8000, tpd: 200000}
      whisper-large-v3:     {rpm: 20, rpd: 2000}
  mistral:
    signup_url: https://console.mistral.ai/api-keys
    base_url: https://api.mistral.ai/v1
    key_env: MISTRAL_API_KEY
    trains_on_data: false
  gemini:
    signup_url: https://aistudio.google.com/apikey
    base_url: https://generativelanguage.googleapis.com/v1beta/openai/
    key_env: GEMINI_API_KEY
    trains_on_data: true      # free tier: test data only
  openrouter:
    signup_url: https://openrouter.ai/settings/keys
    base_url: https://openrouter.ai/api/v1
    key_env: OPENROUTER_API_KEY
    trains_on_data: unknown   # treated as true until you verify the model's provider
  deepgram:
    signup_url: https://console.deepgram.com/
    key_env: DEEPGRAM_API_KEY
    kind: stt_stream
    trains_on_data: false     # every request sets mip_opt_out=true (Model Improvement Program opt-out)
  gladia:
    signup_url: https://app.gladia.io/
    key_env: GLADIA_API_KEY
    kind: stt_stream
    trains_on_data: unknown   # free-plan data terms not verified; meeting audio skips it until you check
  cloudflare:
    signup_url: https://dash.cloudflare.com/profile/api-tokens
    kind: embed
    key_env: CLOUDFLARE_API_TOKEN
    account_env: CLOUDFLARE_ACCOUNT_ID
    trains_on_data: false     # Workers AI terms: customer content isn't used for training
    models:
      bge-small-en-v1.5: {rpd: 10000}
  local:
    kind: stt_local
    model: small.en
    trains_on_data: false     # runs on this machine
    local: true
  ollama:                     # optional: https://ollama.com, then `ollama pull llama3.2:3b`
    base_url: http://127.0.0.1:11434/v1
    trains_on_data: false     # runs on this machine
    local: true
